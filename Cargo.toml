[package]
name = "cargo-shepherd"
version = "0.1.0"
edition = "2024"
authors = ["Ross Sullivan <rosssullivan101@gmail.com>"]
repository = "https://github.com/ranger-ross/cargo-shepherd.git"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
eyre = "0.6"
timeago = { version = "0.6", default-features = false }
bytefmt = "0.1"
num_cpus = "1.16"
regex = "1"
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = "0.3"
ignore = "0.4.33"
rayon = "1.12.0"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
homedir = "0.3.6"
